stages:
  - build:sid
  - build:sid_source
  - build:bullseye
  - build:jammy
  - build:impish
  - build:focal
  - build:spack-ubuntu-20.04.4
  - test:sid
  - test:sid_source
  - test:bullseye
  - test:jammy
  - test:impish
  - test:focal
  - coverage:package
  - coverage-json:source
  - coverage-badge:source

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME_SID: sid:latest
  IMAGE_DESTINATION_SID: $CI_REGISTRY_IMAGE/$IMAGE_NAME_SID
  IMAGE_NAME_SID_SOURCE: sid_source:latest
  IMAGE_DESTINATION_SID_SOURCE: $CI_REGISTRY_IMAGE/$IMAGE_NAME_SID_SOURCE
  IMAGE_NAME_BULLSEYE: bullseye:latest
  IMAGE_DESTINATION_BULLSEYE: $CI_REGISTRY_IMAGE/$IMAGE_NAME_BULLSEYE
  IMAGE_NAME_JAMMY: jammy:latest
  IMAGE_DESTINATION_JAMMY: $CI_REGISTRY_IMAGE/$IMAGE_NAME_JAMMY
  IMAGE_NAME_IMPISH: impish:latest
  IMAGE_DESTINATION_IMPISH: $CI_REGISTRY_IMAGE/$IMAGE_NAME_IMPISH
  IMAGE_NAME_FOCAL: focal:latest
  IMAGE_DESTINATION_FOCAL: $CI_REGISTRY_IMAGE/$IMAGE_NAME_FOCAL
  SPACK_REPO: https://github.com/spack/spack.git
  SPACK_REF: v0.19.0
  PDI_SPACK_REPO : https://github.com/pdidev/spack.git
  GYM_DSSAT_PDI_SPACK_REPO : https://gitlab.inria.fr/rgautron/gym_dssat_pdi-spack.git

build sid:
  stage: build:sid
  allow_failure: true
  tags:
    - ci.inria.fr
    - medium
  image: docker:stable
  script:
    - docker info
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $IMAGE_DESTINATION_SID -f ${CI_PROJECT_DIR}/docker_recipes/Dockerfile_Debian_Sid .
    - docker push $IMAGE_DESTINATION_SID
    - echo "Image ${IMAGE_NAME_SID} successfully pushed to ${IMAGE_DESTINATION_SID}"
  when: manual

