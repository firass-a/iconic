#######################################################
# ACTION AND STATE SPACES RESTRICTIONS FOR ENV SETTINGS
#######################################################
# setting: -> defines the learning tasks
#   all: -> name of the learning task which must coincide with the name associated with the reward function in 'reward_func_dic'
#     action: -> defines the action space
#       - anfer
#       - amir
#     state: -> defines the state space
#       - nstres
#       - istage
#     context: -> defines the 'info' output in the env.step() method of the gym environment
#       - sat
#     experiment_number: 3 -> number of the experiment of the learning task in DSSAT fileX
setting:
  all:
    action:
      - anfer
      - amir
    state:
      - grnwt
      - nstres
      - dap
      - pltpop
      - chtd
      - cwad
      - pcnveg
      - andem
      - nuf
      - uno3
      - unh4
      - xgnp
      - grainn
      - xanc
      - topwt
      - lai
      - tilno
      - gpp
      - dyield
      - dtt
      - cumsumfert
      - istage
      - swfac
    context:
      - sat
      - dul
      - ll
      - dlayr
    experiment_number: 1
  fertilization:
    action:
      - anfer
    state:
      - grnwt
      - nstres
      - dap
      - pltpop
      - chtd
      - cwad
      - pcnveg
      - andem
      - nuf
      - uno3
      - unh4
      - xgnp
      - grainn
      - xanc
      - topwt
      - lai
      - tilno
      - gpp
      - dyield
      - dtt
      - cumsumfert
      - istage
    context:
      - sat
      - dul
      - ll
      - dlayr
    experiment_number: 1
  irrigation:
    action:
      - amir
    state:
      - grnwt
      - nstres
      - dap
      - pltpop
      - chtd
      - cwad
      - pcnveg
      - andem
      - nuf
      - uno3
      - unh4
      - xgnp
      - grainn
      - xanc
      - topwt
      - lai
      - tilno
      - gpp
      - dyield
      - dtt
      - cumsumfert
      - istage
      - swfac
    context:
      - sat
      - dul
      - ll
      - dlayr
    experiment_number: 1
