python coverage package:
  stage: coverage:package
  tags:
    - ci.inria.fr
    - medium
  image: docker:stable
  script:
  - docker run -u 0 -i -v $PWD/coverage:/root/coverage $IMAGE_DESTINATION_SID "pip install coverage && coverage run --source=/opt/gym_dssat_pdi/lib/python3.10/site-packages/gym_dssat_pdi  /opt/gym_dssat_pdi/lib/python3.10/site-packages/gym_dssat_pdi_samples/run_env.py && coverage json -o /root/coverage/coverage.json"
  - apk add --no-cache python3 py3-pip
  - COVERAGE=$(python3 -c 'import sys, json; print(json.load(sys.stdin)["totals"]["percent_covered_display"])' < coverage/coverage.json)
  - pip install anybadge
  - anybadge --value=$COVERAGE --file=coverage.svg coverage
  when: manual
  artifacts:
    when: on_success
    paths:
      - coverage.svg

python coverage source json:
  stage: coverage-json:source
  tags:
    - ci.inria.fr
    - medium
  image: docker:stable
  script:
  - docker run -u 0 -i -v $PWD/coverage:/root/coverage $IMAGE_DESTINATION_SID_SOURCE "pip install coverage && cd /gym_dssat_pdi/gym-dssat-pdi/gym_dssat_pdi_samples && git checkout ${CI_COMMIT_BRANCH} && coverage run --source=../gym_dssat_pdi  ./run_env.py && coverage json -o /root/coverage/coverage.json"
  # when: on_success
  when: manual
  artifacts:
    when: on_success
    paths:
      - $PWD/coverage/coverage.json

python coverage source badge:
  stage: coverage-badge:source
  tags:
    - ci.inria.fr
    - medium
  image: python:3.9-bullseye
  dependencies:
    - python coverage source json
  script:
  - COVERAGE=$(python -c 'import sys, json; print(json.load(sys.stdin)["totals"]["percent_covered_display"])' < ${PWD}/coverage/coverage.json)
  - echo -e "\e[1mCOVERAGE RESULT ${COVERAGE}%\e[0m"
  - pip install anybadge
  - anybadge --value=$COVERAGE --file=coverage.svg coverage
  # when: on_success
  when: manual
  artifacts:
    when: on_success
    paths:
      - coverage.svg

spack-ubuntu-20.04.4:
  stage: build:spack-ubuntu-20.04.4
  before_script:
    - git clone -c feature.manyFiles=true ${SPACK_REPO} --branch ${SPACK_REF}
    - pushd ./spack && git checkout ${SPACK_REF} && popd
    - . "./spack/share/spack/setup-env.sh"
    - git clone ${PDI_SPACK_REPO} ./spack/var/spack/repos/pdi
    - spack repo add ./spack/var/spack/repos/pdi || true # allowing non zero
    - git clone ${GYM_DSSAT_PDI_SPACK_REPO} spack/var/spack/repos/gym-dssat-pdi
    - spack repo add spack/var/spack/repos/gym-dssat-pdi || true
  script:
    - spack install gym-dssat
    - spack env create gym-dssat-pdi spack/var/spack/repos/gym-dssat-pdi/env/spack.yaml
    - spack env activate gym-dssat-pdi
    - spack concretize
    - which python
    - python spack/gym-dssat-pdi/samples/run_env.py
  after_script:
    - rm -rf "./spack" "./.spack"
  tags: 
    - spack-ubuntu-20.04.4