test sid_pytest:
  stage: test:sid_pytest
  tags:
    - ci.inria.fr
    - large
  image: docker:stable
  script:
    - docker run $IMAGE_DESTINATION_SID_SOURCE
    - docker run -v /gym_dssat_pdi/gym-dssat-pdi:/tests $IMAGE_DESTINATION_SID_SOURCE pytest /tests

