python coverage package:
  stage: coverage:package
  tags:
    - ci.inria.fr
    - medium
  script:
  - docker run -u 0 -i -v $PWD/coverage:/root/coverage $IMAGE_DESTINATION_SID "pip install coverage && coverage run --source=/opt/gym_dssat_pdi/lib/python3.9/site-packages/gym_dssat_pdi  /opt/gym_dssat_pdi/lib/python3.9/site-packages/gym_dssat_pdi_samples/run_env.py && coverage json -o /root/coverage/coverage.json"
  - COVERAGE=$(python -c 'import sys, json; print(json.load(sys.stdin)["totals"]["percent_covered_display"])' < coverage/coverage.json)
  - pip install anybadge
  - anybadge --value=$COVERAGE --file=coverage.svg coverage
  when: manual
  artifacts:
    when: on_success
    paths:
      - coverage.svg

python coverage source:
  stage: coverage:source
  tags:
    - ci.inria.fr
    - medium
  script:
  - docker run -u 0 -i -v $PWD/coverage:/root/coverage $IMAGE_DESTINATION_SID_SOURCE "pip install coverage && cd /gym_dssat_pdi/gym-dssat-pdi/gym_dssat_pdi_samples && git checkout ${CI_COMMIT_BRANCH} && coverage run --source=../gym_dssat_pdi  ./run_env.py && coverage json -o /root/coverage/coverage.json"
  - COVERAGE=$(python -c 'import sys, json; print(json.load(sys.stdin)["totals"]["percent_covered_display"])' < coverage/coverage.json)
  - echo -e "\e[1mCOVERAGE RESULT ${COVERAGE}%\e[0m"
  - pip install anybadge
  - anybadge --value=$COVERAGE --file=coverage.svg coverage
  when: on_success
  artifacts:
    when: on_success
    paths:
      - coverage.svg