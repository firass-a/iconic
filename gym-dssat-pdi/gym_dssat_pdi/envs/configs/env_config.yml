################################################################
################################################################
setting:
  all:
    action:
      - anfer
      - amir
    state:
      - yrdoy
      - nstres
      - istage
      - grnwt
      - topwt
      - pltpop
      - swfac
      - pcngrn
      - tleachd
      - tnoxd
      - wtnup
      - cleach
      - cnox
      - cumsumfert
      - xlai
      - trnu
      - rain
      - tmin
      - tmax
      - srad
      - dtt
      - dap
      - ll
  fertilization:
    action:
      - anfer
    state:
      - yrdoy
      - nstres
      - istage
      - grnwt
      - topwt
      - pltpop
      - swfac
      - xlai
      - rain
      - tmin
      - tmax
      - srad
      - dtt
      - dap
  irrigation:
    action:
      - amir
    state:
      - yrdoy
      - nstres
      - istage
      - grnwt
      - topwt
      - pltpop
      - swfac
      - xlai
      - rain
      - tmin
      - tmax
      - srad
      - dtt
      - dap
      - ll