test sid:
  stage: test:sid
  allow_failure: true
  tags:
    - ci.inria.fr
    # - medium
    - large
  image: docker:stable
  script:
    - docker run $IMAGE_DESTINATION_SID
    - echo "Test successfully passed for image ${IMAGE_NAME_SID} in ${IMAGE_DESTINATION_SID}"
  when: manual

